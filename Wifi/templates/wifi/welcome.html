{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - Shell Free Wi-Fi</title>

    <link rel="icon" type="image/png" href="logo2.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            font-family: 'Kanit', sans-serif;
        }

        .welcome-card {
            border-radius: 15px;
            border: 2px solid #ee1c25;
            box-shadow: 0 10px 30px rgba(238, 28, 37, 0.15);
            background-color: #fff;
            padding: 40px 20px;
        }

        .check-icon {
            background-color: #28a745;
            color: white;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            font-size: 3rem;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-go-home {
            background-color: #fbce07;
            color: #333;
            font-weight: 500;
            border-radius: 50px;
            padding: 12px 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 206, 7, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-go-home:hover {
            background-color: #e5bc06;
            box-shadow: 0 6px 20px rgba(251, 206, 7, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="d-flex align-items-center min-vh-100">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="card welcome-card">
                    <div class="mb-4">
                        <img src="{% static 'logo1.png' %}" width="80" alt="Shell">
                    </div>
                    <h1 class="fw-bold mb-3 text-dark">Welcome back</h1>
                    <div class="check-icon">✓</div>
                    <p class="fs-5 text-secondary mb-4">คุณเคยลงทะเบียนแล้ว</p>
                    <hr class="my-4" style="opacity: 0.1; border-color: #ee1c25;">

                    <button type="button" class="btn-go-home" onclick="handleConnect('{{ line_user_id }}')">
                        ไปหน้าเชื่อมต่อ WiFi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleConnect(lineUserId) {
            // ใช้ /log_connect/ ให้ตรงกับ urls.py ของคุณ
            fetch('/log_connect/?lineUserId=' + lineUserId)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.success && data.redirect_url) {
                        window.location.href = data.redirect_url;
                    } else {
                        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("ไม่สามารถเชื่อมต่อได้ในขณะนี้");
                });
        }
    </script>
</body>

</html>
