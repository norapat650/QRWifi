{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Shell Free Wi-Fi</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="2.png">

    <!-- Bootstrap 5 & Google Font -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            /* เปลี่ยนพื้นหลังข้างนอกเป็นสีขาว */
            font-family: 'Kanit', sans-serif;
        }

        .register-card {
            border-radius: 15px;
            /* สร้างกรอบสีแดงให้ border */
            border: 2px solid #ee1c25;
            /* เพิ่มเงาให้ border (Card) */
            box-shadow: 0 10px 30px rgba(238, 28, 37, 0.15);
            background-color: #fff;
        }

        .form-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #fbce07;
            box-shadow: 0 0 0 0.25rem rgba(251, 206, 7, 0.15);
        }

        .btn-register {
            background-color: #fbce07;
            /* ปุ่มเหลือง */
            color: #333;
            font-weight: 500;
            border-radius: 50px;
            padding: 12px;
            border: none;
            width: 100%;
            margin-top: 10px;
            /* เพิ่มเงาให้ปุ่ม */
            box-shadow: 0 4px 15px rgba(251, 206, 7, 0.4);
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background-color: #e5bc06;
            box-shadow: 0 6px 20px rgba(251, 206, 7, 0.6);
            transform: translateY(-2px);
        }

        /* ตกแต่งส่วน LINE ID ให้นุ่มนวลขึ้น */
        .line-id-box {
            background-color: #fdf2f2;
            border: 1px dashed #ee1c25;
            border-radius: 10px;
        }
    </style>
</head>

<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">

                <div class="card register-card p-4">
                    <!-- โลโก้ด้านบน -->
                    <div class="text-center mb-4">
                        <img src="{% static '1.png' %}" width="60" alt="Shell">
                        <h1 class="h3 mt-3 fw-bold text-dark">Register</h1>
                        <p class="text-muted small">กรุณาลงทะเบียนเพื่อใช้งาน Wi-Fi</p>
                    </div>

                    <!-- ข้อมูล LINE ID (ปรับให้เข้ากับขอบแดง) -->
                    <div class="line-id-box py-2 px-3 mb-4 text-center">
                        <span class="text-muted small">LINE ID:</span>
                        <div class="text-danger fw-bold" style="font-size: 0.85rem; word-break: break-all;">
                            {{ line_user_id }}
                        </div>
                    </div>

                    <!-- ฟอร์ม -->
                    <form method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="line_user_id" value="{{ line_user_id }}">

                        <div class="mb-3 text-start">
                            <label class="form-label">ชื่อ-นามสกุล</label>
                            <input type="text" name="first_name" class="form-control" placeholder="ใส่ชื่อของคุณ"
                                required>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label">เบอร์โทรศัพท์</label>
                            <input type="tel" name="phone" class="form-control" placeholder="08x-xxx-xxxx" required>
                        </div>

                        <button type="submit" class="btn btn-register">
                            สมัครสมาชิก
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p style="font-size: 0.75rem; color: #aaa;">
                            ข้อมูลของคุณจะถูกเก็บเป็นความลับตามนโยบายของ Shell
                        </p>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
