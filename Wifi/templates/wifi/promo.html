{% load static %}
<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo2.png">

    <!-- 1. ดึง Bootstrap 5 CSS มาใช้ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- ดึงฟอนต์ Kanit เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            /* เปลี่ยนพื้นหลังข้างนอกเป็นสีขาว */
            font-family: 'Kanit', sans-serif;
        }

        .shell-card {
            border-radius: 15px;
            /* สร้างกรอบสีแดงให้ border */
            border: 2px solid #ee1c25;
            /* เพิ่มเงาให้ border (Card) */
            box-shadow: 0 10px 30px rgba(238, 28, 37, 0.15);
            background-color: #fff;
        }

        .btn-shell {
            background-color: #fbce07;
            /* สีเหลือง Shell */
            color: #333;
            font-weight: 500;
            border-radius: 50px;
            padding: 12px;
            border: none;
            /* เพิ่มเงาให้ button */
            box-shadow: 0 4px 15px rgba(251, 206, 7, 0.4);
            transition: all 0.3s ease;
        }

        .btn-shell:hover {
            background-color: #e5bc06;
            /* เงาเข้มขึ้นตอนเอาเมาส์วาง */
            box-shadow: 0 6px 20px rgba(251, 206, 7, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">

                <!-- เริ่มตัว Card -->
                <div class="card shell-card p-4 text-center">

                    <!-- ส่วนหัว: โลโก้ Shell -->
                    <div class="mb-4">
                        <img src="{% static 'logo1.png' %}" width="80" alt="Shell">
                    </div>

                    <!-- เนื้อหาเดิม -->
                    <h1 class="h3 mb-3 fw-bold">Welcome</h1>

                    <div class="text-start bg-light p-3 rounded-3 mb-3 border">
                        <p class="mb-1 text-muted small">LINE ID:</p>
                        <p class="fw-bold mb-2">{{ line_user_id }}</p>

                        <p class="mb-1 text-muted small">Campaign:</p>
                        <p class="fw-bold mb-0">{{ campaign }}</p>
                    </div>

                    <p class="text-secondary mb-4 small">Welcome Back / Customer Portal</p>

                    <!-- ปุ่มพร้อมเงาตามที่ต้องการ -->
                    <button onclick="connectWifi()" class="btn btn-shell w-100">
                        Connect WiFi
                    </button>

                </div> <!-- จบ Card -->

            </div>
        </div>
    </div>

    <!-- สคริปต์เดิม (ไม่มีการแก้ไข) -->
    <script>
        async function connectWifi() {
            const lineUserId = "{{ line_user_id }}";
            try {
                await fetch(`/log-connect/?lineUserId=${encodeURIComponent(lineUserId)}`);
            } catch (e) {
                console.error('log-connect failed', e);
            }
            alert("WiFi Connected (Demo Mode)");
        }
    </script>

</body>

</html>
